# The server behind the public-web-api example app, deployed as `ios`
# (one domain: marketing page at `/`, device API under `/api/v0`).
#
# Same shape as web/rust/crates/app (config → state → services on
# generic-rust-core's runtime): it scrapes a public API in an Apalis
# task, stores results in SQLite, serves them to devices via the routes
# mobile-api describes, and renders one Askama page about the app.
[package]
name = "public-web-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "public_web_api"
path = "src/lib.rs"

[[bin]]
name = "public-web-api"
path = "src/main.rs"

[dependencies]
generic-rust-core = { workspace = true, features = ["runtime", "database", "events", "tasks", "http", "logging"] }
mobile-api = { workspace = true }

axum = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
askama = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }

tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { workspace = true }

tracing = { workspace = true }

sqlx = { workspace = true }
apalis = { workspace = true }
apalis-sqlite = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }

[build-dependencies]
chrono = { workspace = true }
