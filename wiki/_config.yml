title: generic
tagline: Full-stack project template
description: A batteries-included template for deploying web services with Terraform, Ansible, Kamal, and confit.
baseurl: ""
url: ""

markdown: kramdown
highlighter: rouge

collections:
  docs:
    output: true
    permalink: /docs/:slug/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: docs
    values:
      layout: doc
  - scope:
      path: "index.md"
    values:
      layout: home

exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile

brand:
  primary_color: "#111111"
  accent_color: "#4a4a4a"
  tagline: "Full-stack project template"
