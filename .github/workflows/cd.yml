name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (py, ts-web, rust, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - py
          - ts-web
          - rust

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      deploy-py: ${{ steps.filter.outputs.py }}
      deploy-ts-web: ${{ steps.filter.outputs.ts-web }}
      deploy-rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            py:
              - 'web/py/**'
              - 'bin/kamal'
              - 'config/deploy/py.yml'
              - '.kamal/secrets'
              - '.github/workflows/cd.yml'
              - '.github/workflows/deploy.yml'
            ts-web:
              - 'web/ts/**'
              - 'bin/kamal'
              - 'config/deploy/ts-web.yml'
              - '.kamal/secrets'
              - '.github/workflows/cd.yml'
              - '.github/workflows/deploy.yml'
            rust:
              - 'web/rust/**'
              - 'bin/kamal'
              - 'config/deploy/rust.yml'
              - '.kamal/secrets'
              - '.github/workflows/cd.yml'
              - '.github/workflows/deploy.yml'

  deploy-py:
    needs: detect-changes
    if: |
      always() && (
        (github.event_name == 'push' && needs.detect-changes.outputs.deploy-py == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'py'))
      )
    uses: ./.github/workflows/deploy.yml
    with:
      service: py
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  deploy-ts-web:
    needs: detect-changes
    if: |
      always() && (
        (github.event_name == 'push' && needs.detect-changes.outputs.deploy-ts-web == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'ts-web'))
      )
    uses: ./.github/workflows/deploy.yml
    with:
      service: ts-web
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  deploy-rust:
    needs: detect-changes
    if: |
      always() && (
        (github.event_name == 'push' && needs.detect-changes.outputs.deploy-rust == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'rust'))
      )
    uses: ./.github/workflows/deploy.yml
    with:
      service: rust
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
