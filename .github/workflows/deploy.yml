name: Deploy Service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOCKER_BUILDKIT: 1
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Kamal
        run: gem install kamal -v 2.10.1

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Install confit
        run: |
          curl -fsSL https://raw.githubusercontent.com/krondor-corp/confit/main/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Initialize Terraform
        run: |
          export TF_TOKEN_app_terraform_io=$(confit resolve --reveal credentials.cloud.tfc_token)
          terraform -chdir=iac/stages/production init -input=false

      - name: Deploy
        run: ./bin/kamal ${{ inputs.service }} deploy
