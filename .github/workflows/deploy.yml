name: Deploy Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - static
          - py
          - ts-web
          - rust
      command:
        description: 'Kamal command'
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - setup
          - redeploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Install confit
        run: cargo install --git https://github.com/amiller68/confit

      - name: Install Kamal
        run: gem install kamal

      - name: Configure 1Password
        uses: 1password/load-secrets-action/configure@v2
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Deploy
        run: ./bin/kamal ${{ inputs.service }} ${{ inputs.command }}
