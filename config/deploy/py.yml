service: <%= `confit resolve project.name`.strip %>-py
deploy_timeout: 180
image: <%= `confit resolve credentials.cloud.docker_hub_username`.strip %>/<%= `confit resolve project.name`.strip %>-py

servers:
  web:
    - <%= `confit --set stage=production resolve credentials.server.ip`.strip %>

ssh:
  user: kamal

registry:
  username: <%= `confit resolve credentials.cloud.docker_hub_username`.strip %>
  password:
    - DOCKER_HUB_TOKEN

builder:
  dockerfile: web/py/Dockerfile
  context: web
  arch: amd64
  cache:
    type: registry

proxy:
  ssl: true
  host: <%= `confit resolve services.py.domain`.strip %>
  app_port: <%= `confit resolve services.py.port`.strip %>
  healthcheck:
    path: /_status/livez

env:
  secret:
    - GOOGLE_O_AUTH_CLIENT_ID
    - GOOGLE_O_AUTH_CLIENT_SECRET
    - ANTHROPIC_API_KEY
  clear:
    POSTGRES_URL: postgresql://postgres:postgres@<%= `confit resolve project.name`.strip %>-py-postgres:5432/postgres
    REDIS_URL: redis://<%= `confit resolve project.name`.strip %>-py-redis:6379
    HOST_NAME: https://<%= `confit resolve services.py.domain`.strip %>
    DEBUG: "false"

accessories:
  postgres:
    image: postgres:17-alpine
    host: <%= `confit --set stage=production resolve credentials.server.ip`.strip %>
    port: "5432:5432"
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
    directories:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    host: <%= `confit --set stage=production resolve credentials.server.ip`.strip %>
    port: "6379:6379"
    directories:
      - redis-data:/data
