---
# Configure Cloudflare DNS records for services.
# Runs locally — no SSH needed.

- name: Configure DNS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    server_ip: "{{ lookup('pipe', 'confit --set stage=production resolve credentials.server.ip') }}"
    cloudflare_api_token: "{{ lookup('pipe', 'confit resolve --reveal credentials.cloud.cloudflare_api_token') }}"
    services_config: "{{ lookup('pipe', 'confit show --yaml --reveal services') | from_yaml }}"

  tasks:
    - name: Build domain list from services config
      ansible.builtin.set_fact:
        service_subdomains: "{{ services_config.values() | map(attribute='domain') | list }}"
        dns_root_zone: "{{ (services_config.values() | map(attribute='domain') | first).split('.')[-2:] | join('.') }}"

    - name: Set DNS records
      ansible.builtin.include_tasks: ../tasks/dns.yml
