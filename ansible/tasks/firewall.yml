---
- name: UFW — rate-limit SSH
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: UFW — allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: UFW — allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: UFW — allow high ports
  community.general.ufw:
    rule: allow
    port: "32768:65535"
    proto: tcp

- name: UFW — default deny incoming
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

- name: UFW — default allow outgoing
  community.general.ufw:
    state: enabled
    default: allow
    direction: outgoing
